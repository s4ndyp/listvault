<!DOCTYPE html>
<html lang="nl" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ListVault Pro - Dynamic Grid</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.4/dexie.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="offline_managerv2.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'dark-bg': '#0F111A',
                        'card-bg': '#1E2130',
                        'primary-purple': '#8B5CF6',
                        'border-color': 'rgba(255, 255, 255, 0.08)'
                    },
                    fontSize: { 'xxs': '0.65rem' }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        [v-cloak] { display: none; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.3); border-radius: 10px; }
        .glass-header { background: rgba(15, 17, 26, 0.85); backdrop-filter: blur(12px); }
        .column-header { background-color: #1E2130; border-bottom: 2px solid rgba(139, 92, 246, 0.2); }
    </style>
</head>
<body class="h-full bg-dark-bg text-gray-300 overflow-hidden">

<div id="app" v-cloak class="flex h-screen overflow-hidden">

    <div :class="['fixed md:relative z-[60] h-full w-72 bg-card-bg border-r border-border-color transition-transform duration-300 flex flex-col', showMobileMenu ? 'translate-x-0' : '-translate-x-full md:translate-x-0']">
        <div class="p-4 flex justify-between items-center h-16 shrink-0 border-b border-border-color">
            <div class="font-bold text-white flex items-center gap-2">
                <i class="fas fa-vault text-primary-purple"></i> ListVault
            </div>
            <button @click="showMobileMenu = false" class="md:hidden text-gray-400"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="p-3">
            <input v-model="sidebarSearch" placeholder="Lijst zoeken..." class="w-full bg-dark-bg/50 border border-border-color rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-primary-purple transition-all">
        </div>

        <div class="flex-1 overflow-y-auto px-2 space-y-1">
            <div v-for="list in sidebarFilteredLists" :key="list.id" @click="selectList(list)" 
                 :class="['flex items-center px-3 py-2 text-sm rounded-md cursor-pointer transition-all', 
                          currentList && currentList.id === list.id ? 'bg-primary-purple/20 text-white' : 'hover:bg-white/5']">
                <i :class="['fas fa-table mr-3 text-xs', list.isFavorite ? 'text-yellow-500' : 'text-gray-500']"></i>
                <span class="truncate">{{ list.name }}</span>
            </div>
        </div>

        <div class="p-4 border-t border-border-color bg-card-bg/50 grid grid-cols-2 gap-2">
            <button @click="startCreateList" class="py-2 bg-primary-purple text-white rounded-lg text-xs font-bold">Nieuw</button>
            <label class="py-2 bg-dark-bg border border-border-color text-center rounded-lg text-xs font-bold cursor-pointer">
                Import <input type="file" @change="handleImportCSV" class="hidden" accept=".csv">
            </label>
        </div>
    </div>

    <div class="flex-1 flex flex-col bg-dark-bg overflow-hidden relative">
        
        <button @click="showMobileMenu = true" class="md:hidden fixed bottom-6 right-6 z-50 w-12 h-12 bg-primary-purple text-white rounded-full shadow-lg flex items-center justify-center">
            <i class="fas fa-bars"></i>
        </button>

        <div v-if="currentList" class="flex flex-col h-full overflow-hidden">
            
            <div class="glass-header shrink-0 border-b border-border-color">
                <div class="px-6 h-14 flex items-center justify-between">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <h2 class="text-lg font-bold text-white truncate">{{ currentList.name }}</h2>
                        <button @click="toggleListFavorite(currentList)" class="text-xs">
                            <i :class="['fas fa-star', currentList.isFavorite ? 'text-yellow-500' : 'text-gray-600']"></i>
                        </button>
                    </div>
                    <div class="flex items-center gap-2">
                        <button v-if="hasHiddenColumns" @click="showAllColumns" class="text-xxs bg-primary-purple/20 text-primary-purple px-2 py-1 rounded hover:bg-primary-purple/30 transition-all">
                            <i class="fas fa-eye mr-1"></i> Toon alle kolommen
                        </button>
                        <button @click="isEditMode = !isEditMode" :class="['px-3 py-1.5 rounded-md text-xs font-semibold border transition-all', isEditMode ? 'bg-orange-500/20 border-orange-500/50 text-orange-400' : 'bg-dark-bg border-border-color hover:border-gray-500']">
                            <i class="fas fa-pen-nib mr-1"></i> {{ isEditMode ? 'Klaar' : 'Bewerk' }}
                        </button>
                        <button @click="addRow" class="bg-primary-purple text-white px-3 py-1.5 rounded-md text-xs font-bold shadow-md hover:bg-primary-purple/90 transition-all">
                            <i class="fas fa-plus mr-1"></i> Rij
                        </button>
                    </div>
                </div>

                <div class="px-6 py-2 border-t border-border-color/50 flex gap-4 items-center">
                    <div class="relative flex-1">
                        <i class="fas fa-search absolute left-3 top-2.5 text-gray-600 text-xs"></i>
                        <input v-model="contentSearchQuery" placeholder="Zoek in deze lijst..." class="w-full bg-dark-bg/40 border border-border-color rounded-lg pl-8 pr-3 py-2 text-xs focus:outline-none focus:border-primary-purple transition-all">
                    </div>
                    <div v-if="syncPending > 0" class="text-xxs text-orange-400 animate-pulse font-bold whitespace-nowrap">
                        SYNCING...
                    </div>
                </div>
            </div>

            <div v-if="isEditMode" class="px-6 py-2 bg-primary-purple/5 border-b border-primary-purple/20 overflow-x-auto flex items-center gap-3">
                <span class="text-xxs font-bold text-primary-purple uppercase shrink-0">Breedtes (%):</span>
                <div v-for="col in currentList.columns" :key="col" class="flex flex-col gap-1 shrink-0">
                    <span class="text-xxs text-gray-500 truncate w-16">{{ col }}</span>
                    <input type="number" v-model.number="currentList.columnSettings[col].width" @change="saveCurrentList" class="w-16 bg-dark-bg border border-border-color rounded px-1 text-xs text-white">
                </div>
                <button @click="deleteList" class="ml-auto text-xxs text-red-400 bg-red-400/10 px-2 py-1 rounded border border-red-400/20">
                    Lijst Verwijderen
                </button>
            </div>

            <div class="flex-1 overflow-auto relative custom-scrollbar" ref="scrollContainer">
                
                <div class="sticky top-0 z-30 flex items-center px-6 py-3 column-header text-xxs font-bold text-gray-400 uppercase tracking-widest">
                    <div class="w-8 shrink-0 text-center">#</div>
                    <div v-for="col in visibleColumns" :key="col" 
                         :style="{ flex: `${getColumnWidth(col)} 0 0` }"
                         class="px-2 flex items-center justify-between group">
                        <span class="truncate">{{ col }}</span>
                        <button @click="hideColumn(col)" class="opacity-0 group-hover:opacity-100 text-gray-500 hover:text-white transition-all">
                            <i class="fas fa-eye-slash"></i>
                        </button>
                    </div>
                    <div v-if="isEditMode" class="w-10 shrink-0"></div>
                </div>

                <div class="divide-y divide-border-color/50">
                    <div v-for="(row, idx) in filteredRows" :key="idx" class="flex items-center px-6 py-2 hover:bg-white/[0.02] transition-colors group">
                        <div class="w-8 shrink-0 text-center">
                            <button @click="toggleRecordFavorite(row)" class="text-xs">
                                <i :class="[row.isFavorite ? 'fas fa-star text-yellow-500' : 'far fa-star text-gray-700']"></i>
                            </button>
                        </div>

                        <div v-for="col in visibleColumns" :key="col" 
                             :style="{ flex: `${getColumnWidth(col)} 0 0` }"
                             class="px-2 truncate">
                            <input v-if="isEditMode" v-model="row[col]" @change="saveCurrentList" class="w-full bg-transparent border-b border-transparent focus:border-primary-purple/50 py-1 text-sm outline-none text-white">
                            <div v-else class="text-sm py-1 truncate text-gray-300">{{ row[col] }}</div>
                        </div>

                        <div v-if="isEditMode" class="w-10 shrink-0 text-right">
                            <button @click="deleteRow(idx)" class="text-gray-700 hover:text-red-500 transition-all">
                                <i class="fas fa-trash-alt text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div v-if="isCreating" class="absolute inset-0 z-[100] bg-dark-bg/95 flex items-center justify-center p-4">
            <div class="bg-card-bg p-6 rounded-xl border border-border-color w-full max-w-md shadow-2xl">
                <h3 class="text-white font-bold mb-4 text-lg">Nieuwe Lijst</h3>
                <input v-model="newList.name" placeholder="Naam van de lijst..." class="w-full bg-dark-bg border border-border-color rounded-lg p-3 text-sm text-white mb-4 outline-none focus:border-primary-purple">
                <div class="flex justify-end gap-3">
                    <button @click="isCreating = false" class="text-gray-400 text-sm">Annuleren</button>
                    <button @click="saveNewList" class="bg-primary-purple text-white px-6 py-2 rounded-lg font-bold text-sm shadow-lg">Lijst Opslaan</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const { createApp, ref, computed, onMounted, watch } = Vue;

const API_URL = 'http://10.10.2.20:5000';
const CLIENT_ID = 'sandman';
const APP_NAME = 'listvault';

createApp({
    setup() {
        const manager = new OfflineManager(API_URL, CLIENT_ID, APP_NAME);
        
        const lists = ref([]);
        const currentList = ref(null);
        const syncPending = ref(0);
        const showMobileMenu = ref(false);
        const sidebarSearch = ref('');
        const contentSearchQuery = ref('');
        const isCreating = ref(false);
        const isEditMode = ref(false);
        const newList = ref({ name: '' });

        // --- Data Fetching ---
        const refreshLocalData = async () => {
            const data = await manager.getSmartCollection('data_lists');
            lists.value = data.sort((a,b) => a.name.localeCompare(b.name));
            if (currentList.value) {
                const updated = data.find(l => (l.id||l._id) === (currentList.value.id||currentList.value._id));
                if (updated) {
                    // Behoud columnSettings als die er nog niet zijn
                    if (!updated.columnSettings) updated.columnSettings = {};
                    currentList.value = updated;
                }
            }
        };

        // --- Helpers ---
        const getColumnWidth = (col) => {
            if (!currentList.value.columnSettings || !currentList.value.columnSettings[col]) return 100;
            return currentList.value.columnSettings[col].width || 100;
        };

        const visibleColumns = computed(() => {
            if (!currentList.value) return [];
            return currentList.value.columns.filter(col => {
                const settings = currentList.value.columnSettings[col];
                return settings ? !settings.hidden : true;
            });
        });

        const hasHiddenColumns = computed(() => {
            if (!currentList.value) return false;
            return currentList.value.columns.length !== visibleColumns.value.length;
        });

        const sidebarFilteredLists = computed(() => {
            if (!sidebarSearch.value) return lists.value;
            return lists.value.filter(l => l.name.toLowerCase().includes(sidebarSearch.value.toLowerCase()));
        });

        const filteredRows = computed(() => {
            if (!currentList.value) return [];
            let rows = [...currentList.value.rows];
            if (contentSearchQuery.value) {
                const q = contentSearchQuery.value.toLowerCase();
                rows = rows.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(q)));
            }
            return rows.sort((a,b) => (b.isFavorite === true) - (a.isFavorite === true));
        });

        // --- Actions ---
        const selectList = (list) => {
            // Zorg voor default settings
            if (!list.columnSettings) list.columnSettings = {};
            list.columns.forEach(col => {
                if (!list.columnSettings[col]) list.columnSettings[col] = { width: 100, hidden: false };
            });
            currentList.value = list;
            showMobileMenu.value = false;
            isEditMode.value = false;
            contentSearchQuery.value = '';
        };

        const hideColumn = (col) => {
            currentList.value.columnSettings[col].hidden = true;
            saveCurrentList();
        };

        const showAllColumns = () => {
            currentList.value.columns.forEach(col => {
                currentList.value.columnSettings[col].hidden = false;
            });
            saveCurrentList();
        };

        const toggleListFavorite = (list) => {
            list.isFavorite = !list.isFavorite;
            manager.saveSmartDocument('data_lists', list);
        };

        const saveCurrentList = async () => {
            if (currentList.value) await manager.saveSmartDocument('data_lists', currentList.value);
        };

        const addRow = () => {
            const row = { isFavorite: false };
            currentList.value.columns.forEach(c => row[c] = '');
            currentList.value.rows.unshift(row);
            saveCurrentList();
        };

        const deleteRow = (idx) => {
            const row = filteredRows.value[idx];
            const realIdx = currentList.value.rows.indexOf(row);
            currentList.value.rows.splice(realIdx, 1);
            saveCurrentList();
        };

        const saveNewList = async () => {
            const cols = ['Naam', 'Omschrijving', 'Status'];
            const settings = {};
            cols.forEach(c => settings[c] = { width: 100, hidden: false });
            
            const doc = { 
                name: newList.value.name, 
                columns: cols, 
                columnSettings: settings,
                rows: [], 
                isFavorite: false 
            };
            await manager.saveSmartDocument('data_lists', doc);
            await refreshLocalData();
            isCreating.value = false;
        };

        const deleteList = async () => {
            if (confirm('Verwijderen?')) {
                await manager.deleteSmartDocument('data_lists', currentList.value.id || currentList.value._id);
                currentList.value = null;
                await refreshLocalData();
            }
        };

        const handleImportCSV = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const lines = e.target.result.split('\n').filter(l => l.trim());
                const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
                const settings = {};
                headers.forEach(h => settings[h] = { width: 100, hidden: false });
                
                const rows = lines.slice(1).map(line => {
                    const vals = line.split(',').map(v => v.trim().replace(/^"|"$/g, ''));
                    const obj = { isFavorite: false };
                    headers.forEach((h, i) => obj[h] = vals[i] || '');
                    return obj;
                });
                await manager.saveSmartDocument('data_lists', { name: file.name.replace('.csv', ''), columns: headers, columnSettings: settings, rows: rows, isFavorite: false });
                refreshLocalData();
            };
            reader.readAsText(file);
        };

        onMounted(async () => {
            manager.onSyncChange = (c) => syncPending.value = c;
            manager.onDataChanged = () => refreshLocalData();
            await refreshLocalData();
            manager.refreshCache('data_lists');
        });

        return {
            lists, currentList, sidebarFilteredLists, filteredRows, visibleColumns, hasHiddenColumns,
            showMobileMenu, sidebarSearch, contentSearchQuery, syncPending, isCreating, isEditMode, newList,
            selectList, addRow, deleteRow, saveCurrentList, toggleListFavorite, toggleRecordFavorite: (r) => { r.isFavorite = !r.isFavorite; saveCurrentList(); },
            hideColumn, showAllColumns, getColumnWidth, startCreateList: () => { isCreating.value = true; newList.value.name = ''; },
            saveNewList, deleteList, handleImportCSV
        };
    }
}).mount('#app');
</script>
</body>
</html>
