server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Zorg dat JSON en JS bestanden de juiste headers hebben
    include /etc/nginx/mime.types;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Specifieke caching voor de Service Worker (moet altijd vers zijn)
    location = /sw.js {
        add_header Cache-Control "no-cache";
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
